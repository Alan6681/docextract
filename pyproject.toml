[project]
name = "docextract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alan6681", email = "alanaboamaegbe@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
docextract = "docextract:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
